name: Build Android APK

on:
  push:
    branches: ["arena/01a0ebb5-sih"]
    paths:
      - "WebGame/**"
      - "Assets/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: gradle assembleRelease → signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebGame/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install game dependencies
        working-directory: WebGame
        run: npm ci

      - name: Build the game
        working-directory: WebGame
        run: npm run build

      - name: Sync the game into Android assets
        working-directory: WebGame
        run: node scripts/sync-android.mjs

      - name: Android SDK setup
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Create release keystore
        working-directory: WebGame/android
        run: |
          keytool -genkeypair -v \
            -keystore dhj-release.keystore \
            -alias dhj -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass ambedkar2026 -keypass ambedkar2026 \
            -dname "CN=Team Binary Coders, OU=SIH26096, O=Digital Ambedkar Heritage, L=Erode, S=TN, C=IN"

      - name: Build release APK
        working-directory: WebGame/android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee gradle.log

      - name: Collect APK
        working-directory: WebGame/android
        run: |
          mkdir -p ../../release-package
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../../release-package/ \;
          cp app/build/outputs/apk/release/output-metadata.json ../../release-package/ 2>/dev/null || true
          ls -lh ../../release-package
          if ! ls ../../release-package/*.apk > /dev/null 2>&1; then echo "no apk produced"; exit 1; fi

      - name: Rename to deliverable name
        working-directory: WebGame/android
        run: |
          cd ../../release-package
          for f in *.apk; do
            [ "$f" = "AmbedkarDigitalHeritage.apk" ] || mv "$f" AmbedkarDigitalHeritage.apk
          done
          sha256sum AmbedkarDigitalHeritage.apk | tee AmbedkarDigitalHeritage.apk.sha256
          unzip -l AmbedkarDigitalHeritage.apk | grep -E "assets/www/index.html|assets/www/game.js" || true


      - name: Report failure detail
        if: failure()
        shell: bash
        run: |
          emit() {
            title="$1"; file="$2"
            if [ -f "$file" ]; then
              msg="$(tail -c 6000 "$file" | tr -d '\000' | sed 's/%/%%/g')"
            else
              msg="(no log file: $file)"
            fi
            echo "::error title=$title::$(echo "$msg" | tr '\n' ' ' | cut -c1-6000)"
          }
          emit "electron-builder" WebGame/electron/eb.log
          emit "gradle" WebGame/android/gradle.log
          emit "qa play-through" WebGame/qa.log
          emit "validate" WebGame/validate.log
          emit "nodesmoke" WebGame/nodesmoke.log

      - name: Publish diagnostics (git branch)
        if: always()
        env:
          GH: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          STAGE=/tmp/diag-$(date +%s)
          mkdir -p "$STAGE"
          for f in WebGame/qa.log WebGame/validate.log WebGame/nodesmoke.log WebGame/filesmoke.log \
                   WebGame/electron/eb.log WebGame/android/gradle.log WebGame/android/collect.log \
                   dist/game/build.json; do
            [ -f "$f" ] && cp "$f" "$STAGE/$(basename $f)"
          done
          if [ -d WebGame/scripts/shots ]; then cp -r WebGame/scripts/shots "$STAGE/shots"; fi
          echo "run: $GITHUB_RUN_ID  conclusion: ${{ job.status }}" > "$STAGE/SUMMARY.txt"
          cd "$STAGE"
          git init -q .
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI diagnostics"
          git add -A
          git commit -qm "diagnostics for run $GITHUB_RUN_ID (${{ job.status }})"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GH}.git" HEAD:refs/heads/ci-apk
          echo "diagnostics pushed to ci-apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmbedkarDigitalHeritage-Android-arm64
          retention-days: 90
          path: release-package/

      - name: Ship the built files out (git branch for download)
        if: always()
        shell: bash
        env:
          GH: ${{ github.repository }}
        run: |
          set +e
          STAGE=/tmp/art-$(date +%s)
          mkdir -p "$STAGE"
          n=0
          for f in release-package/*.exe release-package/*.apk release-package/*.zip release-package/*.sha256; do
            [ -f "$f" ] && cp "$f" "$STAGE/" && n=$((n+1))
          done
          if [ "$n" -eq 0 ]; then echo "::notice::no built files to ship"; exit 0; fi
          ls -lh "$STAGE"
          cd "$STAGE"
          {
            echo "Ambedkar: The Digital Heritage Journey"
            echo "SIH 2026 - Problem SIH26096 - Team Binary Coders"
            echo "built from commit ${GITHUB_SHA}"
            echo "workflow run: ${GITHUB_RUN_ID}"
            date -u +"built: %Y-%m-%dT%H:%M:%SZ"
          } > MANIFEST.txt
          git init -q .
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI build output"
          git add -A
          git commit -qm "build output ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GH}.git" HEAD:refs/heads/build-artifacts
          echo "::notice::shipped $n file(s) to build-artifacts"

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/arena/01a0ebb5-sih'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: Ambedkar Digital Heritage — Android APK
          body: |
            **Ambedkar: The Digital Heritage Journey** — Android build.

            SIH 2026 · Problem SIH26096 · Team Binary Coders

            * `AmbedkarDigitalHeritage.apk` — signed release APK (arm64-v8a + armeabi-v7a, minSdk 24, landscape)
            * install: enable *Install unknown apps*, then open the APK
            * checksum: see `AmbedkarDigitalHeritage.apk.sha256`

            Fully offline — no permissions beyond vibration, no network calls.
          files: |
            release-package/AmbedkarDigitalHeritage.apk
            release-package/AmbedkarDigitalHeritage.apk.sha256
