plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sih26096.binarycoders.ambedkardigitalheritage'
    compileSdk 34

    defaultConfig {
        applicationId "com.sih26096.binarycoders.ambedkardigitalheritage"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(project.findProperty('DHJ_STORE_FILE') ?: 'dhj-release.keystore')
            storePassword project.findProperty('DHJ_STORE_PASSWORD') ?: 'ambedkar2026'
            keyAlias project.findProperty('DHJ_KEY_ALIAS') ?: 'dhj'
            keyPassword project.findProperty('DHJ_KEY_PASSWORD') ?: 'ambedkar2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies { }
